<!DOCTYPE html>
<html lang="id">
<head>
    <meta>
    <title>Praktikum 5 - CSS Box Image</title>
    <style>
        body{
            background-color: #f9fbe7;
            margin: 30px;
        }
        .img-box {
            width: 22%;
            height: 220px;
            float: left;
            margin-right: 4%;
            box-sizing: border-box;
        }
        .img-box:last-child {
            margin-right: 0;
        }
        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="img-box"><img src="assets/images/foto1.jpg" alt="Gambar 1"></div>
    <div class="img-box"><img src="assets/images/foto2.jpg" alt="Gambar 2"></div>
    <div class="img-box"><img src="assets/images/foto3.jpg" alt="Gambar 3"></div>
    <div class="img-box"><img src="assets/images/foto4.jpg" alt="Gambar 4"></div>
</body>
</html>
